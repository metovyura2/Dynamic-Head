name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish release (win-x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/DynamicHead/DynamicHead.csproj

      - name: Publish
        run: dotnet publish src/DynamicHead/DynamicHead.csproj -c Release -r win-x64 --self-contained false --no-restore -o dist

      - name: Archive
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath "DynamicHead-${{ github.ref_name }}-win-x64.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: "DynamicHead-${{ github.ref_name }}-win-x64.zip"
          generate_release_notes: true
          draft: false
          prerelease: false
