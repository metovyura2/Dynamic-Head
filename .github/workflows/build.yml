name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (Release, win-x64)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/DynamicHead/DynamicHead.csproj

      - name: Build
        run: dotnet build src/DynamicHead/DynamicHead.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish src/DynamicHead/DynamicHead.csproj -c Release -r win-x64 --self-contained false --no-restore -o dist
